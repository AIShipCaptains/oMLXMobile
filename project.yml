name: oMLXMobile
options:
  bundleIdPrefix: ai.omlx
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  oMLXMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: oMLX Mobile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # Allow plain-HTTP local servers (LAN oMLX / LM Studio / llama.cpp / Ollama)
          NSAllowsLocalNetworking: true